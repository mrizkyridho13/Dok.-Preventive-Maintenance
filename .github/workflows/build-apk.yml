name: Build & Release Android APK

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-apk:
    name: Build PGE-DocuTek APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web bundle
        run: npm run build

      - name: Add Android platform if missing
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Configure Android permissions (CAMERA, READ_EXTERNAL_STORAGE & READ_MEDIA_IMAGES)
        run: |
          node -e "
            const fs = require('fs');
            const manifestPath = 'android/app/src/main/AndroidManifest.xml';
            let xml = fs.readFileSync(manifestPath, 'utf8');

            const additions = [];
            if (!xml.includes('android.permission.CAMERA')) {
              additions.push('    <uses-permission android:name=\"android.permission.CAMERA\" />');
            }
            if (!xml.includes('android.permission.READ_MEDIA_IMAGES')) {
              additions.push('    <uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\" />');
            }
            if (!xml.includes('android.permission.READ_EXTERNAL_STORAGE')) {
              additions.push('    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" />');
            }
            if (!xml.includes('android.permission.ACCESS_MEDIA_LOCATION')) {
              additions.push('    <uses-permission android:name=\"android.permission.ACCESS_MEDIA_LOCATION\" />');
            }
            if (!xml.includes('com.timestamper.timemark')) {
              additions.push(
                '    <queries>\n' +
                '        <intent>\n' +
                '            <action android:name=\"android.media.action.IMAGE_CAPTURE\" />\n' +
                '        </intent>\n' +
                '        <package android:name=\"com.timestamper.timemark\" />\n' +
                '        <package android:name=\"com.jeyluta.timestampcamerafree\" />\n' +
                '        <package android:name=\"com.jeyluta.timestampcamera\" />\n' +
                '    </queries>'
              );
            }

            if (additions.length > 0) {
              xml = xml.replace('<application', additions.join('\n') + '\n\n    <application');
              fs.writeFileSync(manifestPath, xml, 'utf8');
              console.log('Updated AndroidManifest.xml with:', additions.length, 'entries');
            } else {
              console.log('AndroidManifest.xml already contains required permissions');
            }
          "

      - name: Patch Android MediaStore gallery support
        run: node scripts/patch-android-media.cjs

      - name: Generate Android icons and splash screens
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Prepare PGE-DocuTek.apk
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PGE-DocuTek.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PGE-DocuTek-APK
          path: PGE-DocuTek.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: PGE DocuTek v1.0.${{ github.run_number }}
          files: PGE-DocuTek.apk
          generate_release_notes: true
